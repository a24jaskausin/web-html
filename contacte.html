        <h1>Contacta amb nosaltres</h1>

    <nav>

    <p>Si tens algun dubte, pots enviar-nos un missatge.</p>
        <h2>Informació de contacte</h2>

        <p> <strong>Empresa: </strong> Nike Store</p>
        <p><strong>Adreça: </strong> Barcelona, Catalunya</p>
         <p><strong>Horari d'atenció:</strong> De dilluns a divendres, de 9:00 a 18:00 h.</p>


        <h2>Formulari de contacte</h2>

        <form action="#" method="post">

            <label for="nom">Nom:</label>
            <input type="text" name="nom" id="nom">

            <br><br>

            <label for="correu">Correu electrònic:</label>
            <input type="email" name="correu" id="correu">

            <br><br>

            <label for="motiu">Motiu de contacte:</label>

            <select name="motiu" id="motiu">
                <option value="informacio">Sol·licitar informació</option>
                <option value="comanda">Consulta sobre una comanda</option>
                <option value="devolucio">Devolucions</option>
                <option value="altres">Altres consultes</option>
            </select>
           <br><br>

                 <input type="checkbox" id="condicions" name="condicions" required>
                 <label for="condicions"> Accepto les condicions d'ús i la política de privacitat.</label>

            <br><br>

            <button type="submit">Enviar</button>

        </form>



</body>
